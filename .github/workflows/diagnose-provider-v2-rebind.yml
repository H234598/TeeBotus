name: diagnose-provider-v2-rebind

on:
  pull_request:
    paths:
      - TeeBotus/history_dispatcher_bridge.py
      - TeeBotus/history_dispatcher_provider_v2_worker.py
      - tests/test_history_dispatcher_provider_v2*.py
      - tests/fixtures/provider-v2/contract.json
      - .github/workflows/diagnose-provider-v2-rebind.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the same Python boundary as test-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,llm,rag,agents,tools]"
          python -m pip install -r requirements.txt
          python scripts/install_adapter_deps.py --python-only --no-user
      - name: Run provider-v2 bridge and rebind contracts
        run: |
          python -m pytest \
            tests/test_history_dispatcher_bridge.py \
            tests/test_history_dispatcher_provider_v2.py \
            tests/test_history_dispatcher_provider_v2_worker.py \
            tests/test_history_dispatcher_provider_v2_worker_faults.py \
            tests/test_history_dispatcher_provider_v2_codex_cutover.py \
            tests/test_history_dispatcher_provider_v2_rebind.py \
            tests/test_history_dispatcher_provider_v2_worker_rebind_metadata.py \
            -q --tb=short
