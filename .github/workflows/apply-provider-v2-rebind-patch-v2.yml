name: apply-provider-v2-rebind-patch-v2

on:
  pull_request:
    paths:
      - scripts/_patch_provider_v2_rebind_once.py
      - .github/workflows/apply-provider-v2-rebind-patch-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply exact one-time rebind patch
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/_patch_provider_v2_rebind_once.py")
          spec = importlib.util.spec_from_file_location("provider_rebind_patch", path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load provider rebind patch")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original = module.replace_once

          def scoped_replace(source, old, new, *, label):
              if label != "spool rewrite":
                  return original(source, old, new, label=label)
              marker = "class ProviderCallbackSpool:"
              start = source.index(marker)
              return source[:start] + original(
                  source[start:],
                  old,
                  new,
                  label=label,
              )

          module.replace_once = scoped_replace
          module.patch_bridge()
          module.patch_worker()
          PY
          git diff --check
          python -m compileall -q TeeBotus tests
      - name: Commit callback rebind integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TeeBotus/history_dispatcher_bridge.py TeeBotus/history_dispatcher_provider_v2_worker.py
          git commit -m "feat: rebind expired provider callbacks safely"
          git push origin HEAD:${{ github.head_ref }}
