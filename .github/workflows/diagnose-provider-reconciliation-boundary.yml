name: diagnose-provider-reconciliation-boundary

on:
  pull_request:
    paths:
      - TeeBotus/history_dispatcher_bridge.py
      - TeeBotus/history_dispatcher_provider_v2_worker.py
      - tests/test_history_dispatcher_provider_v2_reconciliation_boundary.py
      - .github/workflows/diagnose-provider-reconciliation-boundary.yml

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install minimal boundary dependencies
        run: python -m pip install -q -e . pytest cryptography
      - name: Verify reconciliation claims never reach send
        run: python -m pytest tests/test_history_dispatcher_provider_v2_reconciliation_boundary.py -q --tb=short
