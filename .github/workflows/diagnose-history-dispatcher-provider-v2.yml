name: diagnose-history-dispatcher-provider-v2

on:
  pull_request:
    paths:
      - "TeeBotus/history_dispatcher_bridge.py"
      - "tests/test_history_dispatcher_provider_v2.py"
      - "tests/test_history_dispatcher_bridge.py"
      - "tests/fixtures/provider-v2/**"
      - ".github/workflows/diagnose-history-dispatcher-provider-v2.yml"

permissions:
  contents: read

jobs:
  focused-provider-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install -q -e .
          python -m pip install -q pytest==9.1.1 cryptography
      - name: Compile and run focused bridge tests
        run: |
          python -m compileall -q TeeBotus/history_dispatcher_bridge.py tests/test_history_dispatcher_provider_v2.py
          python -m pytest -q \
            tests/test_history_dispatcher_provider_v2.py \
            tests/test_history_dispatcher_bridge.py \
            --tb=short
