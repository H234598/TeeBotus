name: apply-provider-v2-rebind-patch

on:
  pull_request:
    paths:
      - scripts/_patch_provider_v2_rebind_once.py
      - .github/workflows/apply-provider-v2-rebind-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply exact one-time rebind patch
        run: |
          python scripts/_patch_provider_v2_rebind_once.py
          git diff --check
          python -m compileall -q TeeBotus tests
      - name: Commit callback rebind integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TeeBotus/history_dispatcher_bridge.py TeeBotus/history_dispatcher_provider_v2_worker.py
          git commit -m "feat: rebind expired provider callbacks safely"
          git push origin HEAD:${{ github.head_ref }}
